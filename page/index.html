<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>终端</title>
<style>
  :root { color-scheme: light dark; }
  html, body { margin: 0; height: 100%; }
  body {
    display: grid; place-items: center;
    font: 13px/1.5 var(--magpie-font, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif);
    background: var(--magpie-bg, Canvas);
    color: var(--magpie-fg, CanvasText);
  }
  .box { max-width: 520px; padding: 0 16px; text-align: center; color: var(--magpie-muted, GrayText); }
  .box p { margin: 6px 0; }
  .box b { display: block; color: var(--magpie-fg, CanvasText); font-size: 14px; margin-bottom: 4px; }
  .box button { margin-top: 8px; font: inherit; padding: 4px 14px; }
  .hint code { font-family: ui-monospace, Menlo, Consolas, monospace; user-select: all; }
</style>
</head>
<body>
  <div class="box">
    <b>终端</b>
    <div id="said">正在连接到本地服务…</div>
    <div id="hint" class="hint"></div>
  </div>
  <script src="_magpie/bridge.js"></script>
  <script src="boot.js"></script>
</body>
</html>
