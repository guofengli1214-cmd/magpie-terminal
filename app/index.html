<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>终端</title>
<!-- 内联 data URI 图标：避免浏览器自己请求 /favicon.ico 造成控制台 404。
     必须是 data URI（不发网络请求），不要改成外部文件。 -->
<link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAzMiAzMiI+PHJlY3Qgd2lkdGg9IjMyIiBoZWlnaHQ9IjMyIiByeD0iNiIgZmlsbD0iIzFhMWQyMyIvPjxwYXRoIGQ9Ik03IDlsNyA3LTcgNyIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjN2RkM2ZjIiBzdHJva2Utd2lkdGg9IjMiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCIgc3Ryb2tlLWxpbmVqb2luPSJyb3VuZCIvPjxwYXRoIGQ9Ik0xNyAyM2g4IiBzdHJva2U9IiNlNWU3ZWIiIHN0cm9rZS13aWR0aD0iMyIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIi8+PC9zdmc+">
<!-- 服务端在此处注入两样东西（同一个占位、同一个时机）：
     1) <meta name="magpie-term-token" content="…">  口令（沙箱 iframe 里 cookie 不可用）
     2) <style>html:root{…tokens…}</style>          主题变量
     不要删掉这行注释，服务端靠它定位注入点。 -->
<!-- 服务端在此处注入 <style>:root{…tokens}</style> -->
<link rel="stylesheet" href="/vendor/xterm/xterm.css">
<!-- TASK-FIX17-A R4：在 xterm.css 之后覆盖它写死的 `#000` viewport / composition-view 底色。
     顺序：xterm.css → terminal-surface.css → tokens.css → layout.css → components.css。
     放在 tokens.css 之前也成立（只用 CSS 变量，运行时才解析）。 -->
<link rel="stylesheet" href="/styles/terminal-surface.css">
<link rel="stylesheet" href="/styles/tokens.css">
<link rel="stylesheet" href="/styles/layout.css">
<link rel="stylesheet" href="/styles/components.css">
</head>
<body>
  <!-- V4-E 骨架：左侧 48px 图标栏 + 主区（标签条 / 终端 / 覆盖式 AI 抽屉）。
       AI 不再占左侧栏入口，也没有状态栏开关；右边缘把手是唯一开合入口，
       收起与展开都可见。抽屉默认收起（data-ai-open="false"）。 -->
  <div id="root" data-role="app" data-ai-open="false">
    <!-- TASK-FIX-ACCEPT4：rail 图标从字符/emoji（▣ 🖧 🗀 ⚙）换成内联描边 SVG，
         形状抄 docs/mockups-v4/assets/v4.js 的 i-terminal / i-server / i-folder /
         i-settings（viewBox 0 0 24 24、fill:none、stroke:currentColor）。
         16×16 = 设计稿 .rail-btn .ico 尺寸；按钮本身 36×36 不变。
         每个 svg 都 aria-hidden + focusable=false：图标不进读屏、不在 IE 式
         Tab 序列里，语义只由 .rail-label（视觉隐藏）和 title 提供。 -->
    <nav class="rail" data-role="rail" aria-label="主导航">
      <button type="button" data-role="rail-term" data-active="true" aria-pressed="true" title="终端（本地）">
        <svg class="rail-ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 7l5 5-5 5M12 19h8"/></svg><span class="rail-label">终端</span>
      </button>
      <!-- 主机按钮由 app.js 在 init 时去掉 hidden（历史占位，保持原行为）。 -->
      <button type="button" data-role="rail-hosts" hidden title="主机（即将支持）">
        <svg class="rail-ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3" y="4" width="18" height="6.5" rx="1.6"/><rect x="3" y="13.5" width="18" height="6.5" rx="1.6"/><path d="M7 7.2h.01M7 16.8h.01"/></svg><span class="rail-label">主机</span>
      </button>
      <!-- TASK-V4-G：文件面板是终端下方的常驻区域，入口在这里（与主机分开）。 -->
      <button type="button" data-role="rail-files" aria-pressed="false" title="文件面板">
        <svg class="rail-ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6H9l2 2.2h8.5A1.5 1.5 0 0 1 21 9.7v8.8a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18.5z"/></svg><span class="rail-label">文件</span>
      </button>
      <div class="rail-spacer" aria-hidden="true"></div>
      <button type="button" data-role="rail-settings" title="设置">
        <svg class="rail-ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="3.1"/><path d="M12 2.8v2.4M12 18.8v2.4M21.2 12h-2.4M5.2 12H2.8M18.5 5.5l-1.7 1.7M7.2 16.8l-1.7 1.7M18.5 18.5l-1.7-1.7M7.2 7.2L5.5 5.5"/></svg><span class="rail-label">设置</span>
      </button>
    </nav>

    <section class="main" data-role="main">
      <div data-role="tabbar"></div>
      <div data-role="terminal-host"></div>
      <!-- TASK-V4-G：文件面板（终端下方，横向图标网格，高度可拖）。
           结构由 app/ui/file-panel.js 填；这里只留挂载点。 -->
      <div data-role="file-panel-host"></div>
      <!-- 收起与展开都只有这一个把手：展开时跟着抽屉左缘走（styling 见 layout.css）。 -->
      <button type="button" data-role="ai-handle" data-badge="0" title="打开 AI 助手" aria-label="打开 AI 助手" aria-expanded="false">
        <span class="handle-icon" aria-hidden="true">‹</span>
        <span class="handle-text" aria-hidden="true">AI</span>
        <span class="handle-badge" data-role="ai-handle-badge" hidden>0</span>
      </button>
      <!-- 覆盖式抽屉：position:absolute，压在终端之上，不改终端宽度。 -->
      <aside class="drawer" data-role="ai-drawer" aria-label="AI 助手"></aside>
    </section>

    <div data-role="statusbar"></div>
    <div data-role="toast-stack" aria-live="polite"></div>
    <div data-role="settings-host"></div>
  </div>
  <script src="/vendor/xterm/xterm.js"></script>
  <script src="/vendor/xterm/addon-fit.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
